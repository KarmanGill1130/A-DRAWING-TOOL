<!DOCTYPE html>

<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>Drawing App JavaScriptl</title>
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="MAINPAGE.CSS">
    <link rel="icon" type="image/x-icon" href="brush.png">
    
    
  </head>
  <body>

    
    <div class="container">
      <section class="tools-board">
        <div class="row">
          <label class="title">Shapes</label>
          <ul class="options">
            <li class="option tool" id="rectangle">
              <img src="icons/rectangle.svg" alt="">
              <span>Rectangle</span>
            </li>
            <li class="option tool" id="circle">
              <img src="icons/circle.svg" alt="">
              <span>Circle</span>
            </li>
            <li class="option tool" id="triangle">
              <img src="icons/triangle.svg" alt="">
              <span>Triangle</span>
            </li>
            <li class="option tool" id="star">
                <img src="icons/star.svg" alt="">
                <span>Star</span>
            </li>
            <li class="option tool" id="oval">
              <img src="icons/star.svg" alt="">
              <span>oval</span>
          </li>
                more:</td><td><select name="select">
                  <option value=""></option>
                  <option value="oval"  class="option tool" id="star">oval</option>
                  <option value="arrow">arrow</option>
                  <option value="square">square</option>
                  <option value="cloud">cloud</option>
                  <option value="moon">moon</option>
                  <option value="line">line</option>
                  </select>
                  
            <li class="option">
              <input type="checkbox" id="fill-color">
              <label for="fill-color">Fill color</label>
            </li>
          </ul>
        </div>
        
      
        <div class="row">
          <label class="title">Options</label>
          <ul class="options">
            <li class="option active tool" id="brush">
              <img src="icons/brush.svg" alt="">
              Brushes:</td><td><select name="select">
                <option value=""></option>
                <option value="brush">brush</option>
                <option value="calligraphy brush">caligraphy brush</option>
                <option value="calligraphy pen ">calligraphy pen </option>
                <option value="airbrush">airbrush</option>
                <option value="oil brush">oil brush</option>
                <option value="cryon">cryon</option>
                <option value="Marker">Marker</option>
                <option value="Natural pencil">Natural pencil</option>
                <option value="watercolor brush">watercolor brus</option>
                </select>
            </li>
            <li class="option tool" id="eraser">
              <img src="icons/eraser.svg" alt="">
              <span>Eraser</span>
            </li>
            
            
            
            
              <li class="option tool" id="eraser">
                <img src="icons/magnifier.svg" alt="">
                <span>magnifier</span>
            </li>
            <li class="option">
              <input type="range" id="size-slider" min="1" max="30" value="5">
            </li>
          </ul>
        </div>
       
        <div class="row colors">
          <label class="title">Colors</label>
          <ul class="options">
            <li class="option"></li>
            <li class="option selected"></li>
            <li class="option"></li>
            <li class="option"></li>
            <li class="option"></li>
              <input type="color" id="color-picker" value="#4A98F7">
            </li>
          </ul>
        </div>

        <input id="file" name="Insert image" type="file" accept="image/*">

        <div class="row buttons">
          <button class="clear-canvas">Clear Canvas</button>
          <button class="save-img">Save As Image</button>
        </div>
      </section>
      <section class="drawing-board">
        <canvas></canvas>
      </section>
    </div>
    <script src="script.js">
  
</script>

    
</body>
</html>
